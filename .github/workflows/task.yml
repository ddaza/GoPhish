name: Task 

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go and Task
        uses: ./.github/actions/setup

      - name: Build
        run: task build:linux

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go and Task
        uses: ./.github/actions/setup

      - name: Run tests
        run: task test
